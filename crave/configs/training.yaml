seeds: [17, 29, 43]
k: 3
k_development_candidates: [3, 5, 8]
epochs: 100
learning_rate: 0.001
batch_size: 64
optimizer: Adam
weights: {cost: 0.25, cal: 0.25, rank: 0.25, interaction: 0.25}
