[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crave-research"
version = "0.1.0"
description = "Matched counterfactual long-horizon allocation for budgeted LLM agents"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "onnxruntime>=1.20", "tokenizers>=0.21", "scipy>=1.14", "matplotlib>=3.9", "PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["crave/tests"]
